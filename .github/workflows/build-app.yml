name: Build Cove.app

# Pull requests (to Development or main): build check, no secrets.
# Run workflow (Actions tab): builds an ad-hoc signed test app as a downloadable artifact. No secrets.
# Push a version tag (git tag v1.16.0 && git push origin v1.16.0): the "release" job builds, signs and attests the
# release and creates it as a DRAFT on GitHub. Write the notes and publish it there; the in-app updater only sees
# published releases.
#
# The signing secrets (CODESIGN_P12, CODESIGN_P12_PASSWORD, COVE_UPDATE_KEY) live in the GitHub Environment
# "release", which only v* tags may use, and a tag ruleset lets only the owner create v* tags. No other job, branch
# or pull request can read them. See RELEASING.md.
on:
  pull_request:
    branches: [Development, main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version shown in the app (e.g. v0.5Beta). Leave empty to use the latest git tag.'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Build check and test artifact: never touches a secret.
  build:
    if: github.event_name != 'push'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # tags, for the version shown in the app

      # The Glass3D theme uses the macOS 26 glass and scroll-edge APIs, which need the Xcode 26 SDK
      - name: Select Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || { echo "::error::No Xcode 26 on this runner"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: Show Swift version
        run: swift --version

      - name: Unit tests
        run: swift test

      - name: Build app bundle (ad-hoc signature)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$VERSION" ]; then unset VERSION; fi
          ./make-app.sh
          codesign -dv dist/Cove.app 2>&1 | grep -E 'Identifier|Signature|flags'

      - name: Smoke test (the app starts and keeps running)
        run: |
          dist/Cove.app/Contents/MacOS/Cove & PID=$!
          sleep 15
          kill -0 $PID || { echo "::error::Cove exited during launch"; exit 1; }
          kill $PID

      - name: Zip app
        if: github.event_name == 'workflow_dispatch'
        run: cd dist && ditto -c -k --keepParent Cove.app Cove.zip

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Cove-app
          path: dist/Cove.zip
          if-no-files-found: error

  # Signed release: v* tags only. What keeps the secrets away from everything else is the environment's deployment
  # rule (v* tags only) plus the tag ruleset; the `if` below just skips the job for other events.
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    environment: release
    permissions:
      contents: write        # create the draft release
      id-token: write        # build provenance attestation
      attestations: write
    env:
      HAS_CERT: ${{ secrets.CODESIGN_P12 != '' }}
      HAS_UPDATE_KEY: ${{ secrets.COVE_UPDATE_KEY != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # The Glass3D theme uses the macOS 26 glass and scroll-edge APIs, which need the Xcode 26 SDK
      - name: Select Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || { echo "::error::No Xcode 26 on this runner"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: Show Swift version
        run: swift --version

      - name: Check release setup
        run: |
          grep -q 'static let publicKey = ""' Sources/Updater.swift && { echo "::error::Updater.publicKey is empty (see RELEASING.md)"; exit 1; }
          [ "$HAS_UPDATE_KEY" = true ] || { echo "::error::Secret COVE_UPDATE_KEY is missing from the 'release' environment (see RELEASING.md)"; exit 1; }
          [ "$HAS_CERT" = true ] || { echo "::error::Secret CODESIGN_P12 is missing from the 'release' environment (see RELEASING.md)"; exit 1; }

      - name: Import signing certificate
        env:
          CODESIGN_P12: ${{ secrets.CODESIGN_P12 }}
          CODESIGN_P12_PASSWORD: ${{ secrets.CODESIGN_P12_PASSWORD }}
        run: echo "CODESIGN_IDENTITY=$(scripts/ci-import-cert.sh)" >> "$GITHUB_ENV"

      - name: Build app bundle
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          ./make-app.sh
          codesign -dv dist/Cove.app 2>&1 | grep -E 'Identifier|Authority|Signature|flags'

      - name: Smoke test (the app starts and keeps running)
        run: |
          dist/Cove.app/Contents/MacOS/Cove & PID=$!
          sleep 15
          kill -0 $PID || { echo "::error::Cove exited during launch"; exit 1; }
          kill $PID

      - name: Zip app
        run: cd dist && ditto -c -k --keepParent Cove.app Cove.zip

      - name: Sign update
        # The signature must verify with the key that INSTALLED apps trust, i.e. the public key in the latest
        # published release, not the one in this commit. They differ only in a key-rotation release, which is
        # signed with the old key and ships the new public key (see RELEASING.md).
        env:
          COVE_UPDATE_KEY: ${{ secrets.COVE_UPDATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          key() { sed -n 's/.*static let publicKey = "\(.*\)".*/\1/p'; }
          NEW=$(key < Sources/Updater.swift)
          PREV=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" -q .tag_name 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            TRUSTED=$(git show "$PREV:Sources/Updater.swift" | key)
          else
            TRUSTED=$NEW
          fi
          [ -n "$TRUSTED" ] || { echo "::error::No public key found in $PREV:Sources/Updater.swift"; exit 1; }
          if [ "$TRUSTED" != "$NEW" ]; then
            echo "::notice::Key rotation: signing with the key trusted by $PREV; this release ships a new public key."
          fi
          swift scripts/sign-update.swift dist/Cove.zip "$TRUSTED" || {
            echo "::error::COVE_UPDATE_KEY doesn't match the key installed apps trust ($PREV). During a key rotation the" \
                 "new private key goes into the 'release' environment only AFTER the rotation release is published."
            exit 1; }

      - name: Attest build provenance
        # Public proof of how the build was made (Sigstore). Best effort: when Sigstore is down the release still
        # goes out; updates stay protected by the update signature (Cove.zip.sig)
        continue-on-error: true
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/Cove.zip

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Cove-app
          path: |
            dist/Cove.zip
            dist/Cove.zip.sig
          if-no-files-found: error

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/Cove.zip dist/Cove.zip.sig --draft --title "Cove $TAG" \
            --notes "Built by GitHub Actions from $(git rev-parse --short HEAD). Write the release notes here, then publish."
